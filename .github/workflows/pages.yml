name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", "pointcli.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 */6 * * *" # 6시간마다 이벤트 갱신 (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect events
        env:
          POINTCLI_DB: ${{ runner.temp }}/point.db
        run: |
          python3 pointcli.py init
          python3 pointcli.py collect
          python3 pointcli.py export-events --out app/events.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
